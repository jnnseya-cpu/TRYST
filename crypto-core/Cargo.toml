[package]
name = "tryst_crypto_core"
version = "0.1.0"
edition = "2021"
description = "TRYST shared client crypto core: per-media keys, per-recipient wrapping, revocation (docs/spec/03_Backend.md §6.2, 04 §6). OpenMLS integration follows in P1."
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
