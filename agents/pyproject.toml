[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tryst-agents"
version = "0.1.0"
description = "TRYST agent services (Broker, Envoy, Mirror ...). Spec: docs/spec/03_Backend.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
