name: site (public website and journal)
on:
  push:
    paths: ['site/**', 'shared/brand/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'shared/brand/**', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  site:
    name: Editorial rules, types and static build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    env: { NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
