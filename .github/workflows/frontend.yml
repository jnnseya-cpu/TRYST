name: frontend
on:
  push:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  frontend:
    name: Web PWA (Next.js)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env: { NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", check-latest: true, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
