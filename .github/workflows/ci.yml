name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: Spec consistency and migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_spec.py
      - run: python3 scripts/gen_migrations.py --check
      - run: pip install pglast && python3 -c "import glob,pglast; [pglast.parse_sql(open(f).read()) for f in glob.glob('backend/migrations/*/*.sql')]; print('SQL parses')"
      - run: python3 -c "import re,pglast; t=open('docs/spec/09_Operating_System.md').read(); pglast.parse_sql(re.search(r'### 10.2 DDL\n\n\`\`\`sql\n(.*?)\`\`\`', t, re.S).group(1)); print('OS DDL parses')"

  contracts:
    name: OpenAPI and Protobuf contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npx --yes @redocly/cli@1 lint contracts/openapi/tryst.v1.yaml contracts/openapi/ops.v1.yaml --config contracts/openapi/redocly.yaml
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install grpcio-tools
          mkdir -p /tmp/protoout
          python3 -m grpc_tools.protoc -Icontracts/proto --python_out=/tmp/protoout $(find contracts/proto -name '*.proto')

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: tryst_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRYST_TEST_PG: postgres://postgres:test@localhost:5432/tryst_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Security analysis (vulnerabilities, static analysis, gosec)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...

  agents:
    name: Agents (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agents } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: python -m pytest -q

  crypto-core:
    name: Crypto core (Rust)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: crypto-core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Web PWA (Next.js)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    env: { NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Passkey login end-to-end (Chromium virtual authenticators)
    runs-on: ubuntu-latest
    needs: [backend, web]
    defaults: { run: { working-directory: web } }
    env: { NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  images:
    name: Container images and infrastructure
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tryst-api:ci backend
      - run: docker build -f web/Dockerfile -t tryst-web:ci .
      - name: API container starts and answers its health check
        run: |
          docker run -d --name api -e TRYST_ENV=dev -p 8081:8081 tryst-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8081/readyz && break; sleep 1; done
          docker exec api /identity-svc healthcheck
          docker inspect -f '{{.Config.User}}' tryst-api:ci | grep -q nonroot
      - name: Image vulnerability scan (HIGH and CRITICAL fail the build)
        run: |
          for img in tryst-api:ci tryst-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
              image --quiet --severity HIGH,CRITICAL --exit-code 1 "$img"
          done
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform validate
