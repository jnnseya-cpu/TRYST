name: spec-check
on:
  pull_request:
    paths: ["docs/**", "scripts/check_spec.py"]
  push:
    paths: ["docs/**", "scripts/check_spec.py"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_spec.py
