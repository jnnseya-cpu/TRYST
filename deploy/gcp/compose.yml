# Production on one Google Compute Engine VM (europe-west2, London). See
# docs/runbooks/go-live.md.
#
#   Internet -> Google Cloud external Application Load Balancer (TLS with a Google-managed
#   certificate, Cloud Armor WAF and rate limits; IAP on the console)
#     -> VM :3000 web (member site)   -> api, safety on the private network
#     -> VM :3001 ops (staff console) -> safety
#   api and safety are never published; PostgreSQL is Cloud SQL on a private IP. The VM
#   firewall admits 3000/3001 only from Google's load-balancer ranges.
#
# The "vps" profile (Caddy with automatic HTTPS, local PostgreSQL) runs a development or
# demo copy on a plain VPS such as Hostinger: TRYST_ENV=dev, stand-in vendors, no real data.
#
# Images are pinned by digest in /etc/tryst/images.env (deploy.sh), with LB_IP (the load
# balancer's address). Settings and secrets come from /run/tryst/*.env, written at boot by
# fetch-secrets.sh (tmpfs, never on disk).
name: tryst
services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: unless-stopped
    environment:
      TRYST_ENV: ${TRYST_ENV:-prod}            # "dev" shows the stand-in check and checkout pages
    ports: ["3000:3000"]                     # load balancer only (firewall)
    networks: [edge, app]
    depends_on: { api: { condition: service_healthy } }

  ops:
    image: ${OPS_IMAGE:?set OPS_IMAGE}       # the same web code built with OPS_CONSOLE=1
    restart: unless-stopped
    ports: ["3001:3000"]                     # load balancer only, behind IAP
    networks: [edge, app]
    depends_on: { safety: { condition: service_healthy } }

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    env_file: [/run/tryst/api.env]
    environment:
      TRYST_ENV: ${TRYST_ENV:-prod}            # "dev" only on a demo VPS
      INTERNAL_ADDR: ":8091"
      METRICS_ADDR: ":9090"
      SAFETY_INTERNAL_URL: http://safety:8092
      # Who may set X-Forwarded-For: the web container, Google's load-balancer front ends
      # and the load balancer's own address (the load balancer appends "<client>, <LB_IP>").
      # The API walks the chain from the right and rate-limits the first address that isn't one.
      TRUSTED_PROXIES: "172.30.0.0/16,35.191.0.0/16,130.211.0.0/22,${LB_IP:?set LB_IP}"
    stop_grace_period: 30s                   # in-flight safety alerts finish
    read_only: true
    healthcheck: { test: ["CMD", "/identity-svc", "healthcheck"], interval: 10s, retries: 30, start_period: 30s }
    networks: [app]

  safety:
    image: ${API_IMAGE:?set API_IMAGE}
    entrypoint: ["/safety-svc"]
    restart: unless-stopped
    env_file: [/run/tryst/safety.env]
    environment:
      TRYST_ENV: ${TRYST_ENV:-prod}            # "dev" only on a demo VPS
      INTERNAL_ADDR: ":8092"
      METRICS_ADDR: ":9092"
      PLATFORM_INTERNAL_URL: http://api:8091
      SETTINGS_STORE: gcp                      # leads manage vendor keys in the console
      SETTINGS_PREFIX: tryst-${ENV:-prod}-
    stop_grace_period: 30s
    read_only: true
    healthcheck: { test: ["CMD", "/safety-svc", "healthcheck"], interval: 10s, retries: 30, start_period: 30s }
    networks: [app]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9091:9090"]           # reach it over IAP/SSH tunnel only
    networks: [app]

  # A development or demo copy on a VPS (profile "vps"): TLS by Caddy, local PostgreSQL,
  # dev mode. Never real members' data.
  caddy:
    image: caddy:2.10.2
    profiles: [vps]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment: { SITE_HOST: "${SITE_HOST:-}", CONSOLE_HOST: "${CONSOLE_HOST:-}" }
    networks: [edge]

  db:
    image: postgres:16-alpine
    profiles: [vps]
    restart: unless-stopped
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}" }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [app]

networks:
  edge: { ipam: { config: [{ subnet: 172.30.1.0/24 }] } }
  app: { ipam: { config: [{ subnet: 172.30.2.0/24 }] } }

volumes:
  caddy_data: {}
  pgdata: {}
