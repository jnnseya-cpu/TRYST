openapi: 3.1.0
info:
  title: TRYST Edge API
  version: 1.2.0
  summary: Edge contract for the TRYST web PWA and native apps.
  description: |
    Generated from docs/spec/02_Shared_Contracts.md §5 (spec v1.2). That section is the
    source of truth; change it first, then this file (docs/spec/00_README.md §4).

    Cross-cutting rules (02 §5): every request carries a DPoP proof bound to the device key;
    middleware order is jurisdiction gate → tier gate → Art. 9 consent → rate limit →
    idempotency. All POST/PUT/DELETE require `Idempotency-Key`. Anything not visible to the
    caller returns a uniform 404 `not_found` (existence never leaks).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://app.tryst.example/v1
    description: Placeholder host; real domains per docs/spec/01_Product.md §3.
security:
  - dpop: []
tags:
  - name: auth
  - name: assurance
  - name: account
  - name: intake
  - name: discretion
  - name: couple
  - name: discovery
  - name: handshake
  - name: reveal
  - name: threads
  - name: safety
  - name: commerce

x-tier-gate:
  description: Minimum verification tier per operation is given by `x-min-tier` (02 §3.2).

paths:
  # ---------------------------------------------------------------- auth (02 §3.3, §5.1)
  /auth/start:
    post:
      tags: [auth]
      operationId: authStart
      summary: Sign-up only. Send OTP to a contact handle. Never a login factor.
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              properties:
                contact: { type: string, description: E.164 phone or email }
      responses:
        '202': { description: Uniform response whether or not the account exists }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/verify:
    post:
      tags: [auth]
      operationId: authVerify
      summary: Sign-up only. Verify OTP, register device; ban-anchor check for new identities.
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact, otp]
              properties:
                contact: { type: string }
                otp: { type: string }
                jurisdiction: { type: string, minLength: 2, maxLength: 2, description: 'ISO 3166-1 alpha-2; default GB' }
                device_pubkey: { type: string, contentEncoding: base64 }
                attestation: { type: string, contentEncoding: base64 }
      responses:
        '200':
          description: Existing onboarding session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '201':
          description: New account; onboarding session (sign-up device only until V1) and the one-time emergency code, shown once (FR-064)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Session' }
                  - { type: object, properties: { emergency_code: { type: string } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/passkeys/register/begin:
    post:
      tags: [auth]
      operationId: passkeyRegisterBegin
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialCreationOptions (userVerification=required)
          content: { application/json: { schema: { type: object } } }
  /auth/passkeys/register/finish:
    post:
      tags: [auth]
      operationId: passkeyRegisterFinish
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: WebAuthn attestation response } } }
      responses:
        '201': { description: Authenticator registered }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/enrol-device:
    post:
      tags: [auth]
      operationId: enrolDeviceBegin
      summary: Onboarding only. One-time 10-minute link for the member's phone.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: Enrol link
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrol_token: { type: string }
                  enrol_path: { type: string }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/enrol-device/redeem:
    post:
      tags: [auth]
      operationId: enrolDeviceRedeem
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrol_token]
              properties:
                enrol_token: { type: string }
      responses:
        '200':
          description: Onboarding session on the phone (may only register passkeys)
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/login/begin:
    post:
      tags: [auth]
      operationId: loginBegin
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_hint: { type: string }
      responses:
        '200':
          description: Challenge plus server-decided required factors. Uniform response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginChallenge' }
  /auth/login/passkey:
    post:
      tags: [auth]
      operationId: loginPasskey
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: WebAuthn assertion (B1 or F1) } } }
      responses:
        '200':
          description: First factor accepted. No session is issued yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginState' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/login/liveness:
    post:
      tags: [auth]
      operationId: loginLiveness
      summary: Mobile second factor (B2). Session issued only after provider match callback.
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Provider hand-off
          content:
            application/json:
              schema:
                type: object
                properties:
                  handoff_url: { type: string, format: uri }
                  login_state: { $ref: '#/components/schemas/LoginState' }
  /auth/login/cross-device:
    post:
      tags: [auth]
      operationId: loginCrossDeviceBegin
      summary: Desktop second factor (F2). Returns a 60 s QR token.
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: QR token
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_token: { type: string }
                  expires_at: { type: string, format: date-time }
  /auth/login/cross-device/{qr_token}:
    get:
      tags: [auth]
      operationId: loginCrossDeviceStatus
      summary: Polled by the desktop. Requires the login id as well, so the QR code alone cannot collect the session.
      security: []
      x-min-tier: none
      parameters:
        - { name: qr_token, in: path, required: true, schema: { type: string } }
        - { name: X-Login-Id, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pending, denied, or a Session once approved from the registered phone
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginState'
                  - $ref: '#/components/schemas/Session'
  /auth/approvals/{qr_token}:
    post:
      tags: [auth]
      operationId: approveDesktopLogin
      summary: Called from the registered mobile app with a fresh B1 assertion.
      x-min-tier: V1
      parameters:
        - { name: qr_token, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, assertion]
              properties:
                decision: { type: string, enum: [approve, deny] }
                assertion: { type: object }
      responses:
        '204': { description: Recorded }
  /auth/approvals/{qr_token}/begin:
    post:
      tags: [auth]
      operationId: approveDesktopLoginBegin
      summary: Assertion options restricted to the account's registered phone passkeys.
      security: []
      x-min-tier: none
      parameters:
        - { name: qr_token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: WebAuthn request options, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /auth/login/second-key/begin:
    post:
      tags: [auth]
      operationId: secondKeyBegin
      summary: Desktop F2 alternative; allows only a different registered security key.
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/LoginRef' }
      responses:
        '200': { description: WebAuthn request options, content: { application/json: { schema: { type: object } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/login/second-key:
    post:
      tags: [auth]
      operationId: secondKeyFinish
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_id, credential]
              properties:
                login_id: { type: string }
                credential: { type: object }
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [auth]
      operationId: me
      x-min-tier: V0
      responses:
        '200':
          description: Session summary; no contact or identity data
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_kind: { type: string, enum: [onboarding, full, recovery] }
                  surface: { $ref: '#/components/schemas/Surface' }
                  tier: { $ref: '#/components/schemas/Tier' }
                  passkeys: { type: integer }
                  expires_at: { type: string, format: date-time }
                  step_up: { type: boolean }
                  recovery_pending: { type: [object, 'null'], description: Open recovery on this account (state and hold_until) }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-min-tier: V0
      responses: { '204': { description: Session ended } }
  /auth/step-up:
    post:
      tags: [auth]
      operationId: stepUp
      summary: Starts the sign-in ceremony bound to this session and account (FR-125, D-62). Continue with /auth/login/passkey and the second factor; finishing marks this session stepped up for 5 minutes instead of issuing a new session.
      x-min-tier: V0
      responses:
        '200':
          description: WebAuthn options for the first factor
          content:
            application/json:
              schema:
                type: object
                properties:
                  login_id: { type: string }
                  options: { type: object }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/recovery/begin:
    post:
      tags: [auth]
      operationId: recoveryBegin
      summary: Uniform for any contact; an unknown contact gets a recovery that can never complete. 3 a day per contact. The account is told (FR-061, FR-125).
      security: []
      x-min-tier: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              properties:
                contact: { type: string }
      responses:
        '202':
          description: Recovery started
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_id: { type: string, description: Bearer secret held by the recovering browser }
                  hold_hours: { type: integer }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/recovery/{id}:
    get:
      tags: [auth]
      operationId: recoveryStatus
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Recovery state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [checks, hold, ready, failed, cancelled, expired, done] }
                  liveness_done: { type: boolean }
                  id_done: { type: boolean }
                  hold_until: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }
  /auth/recovery/{id}/check:
    post:
      tags: [auth]
      operationId: recoveryCheck
      summary: Provider hand-off for the face check or the ID check. The ID check needs the face check first and must be on the document the account was verified with; a different document ends the recovery.
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [liveness, age] }
      responses:
        '201':
          description: Provider session
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  url: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/recovery/{id}/finish:
    post:
      tags: [auth]
      operationId: recoveryFinish
      summary: After the 24-hour hold, revokes every passkey and session and issues a 15-minute recovery session that may only register a passkey.
      security: []
      x-min-tier: none
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Recovery session
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  expires_at: { type: string, format: date-time }
                  kind: { type: string, const: recovery }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/recovery/cancel:
    post:
      tags: [auth]
      operationId: recoveryCancel
      summary: Cancels every open recovery of the caller's account, from any signed-in device. Never needs step-up.
      x-min-tier: V0
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Refreshed session
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
  /devices/key:
    put:
      tags: [threads]
      operationId: putDeviceKey
      summary: Register this device's ECDH P-256 public key for end-to-end encryption (private keys never leave the device). At most 5 devices.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, public_jwk]
              properties:
                device_id: { type: string, minLength: 8, maxLength: 64 }
                public_jwk: { type: object, required: [kty, crv, x, y], properties: { kty: { const: EC }, crv: { const: P-256 }, x: { type: string }, y: { type: string } } }
      responses: { '200': { description: Updated }, '201': { description: Added }, '422': { $ref: '#/components/responses/Problem' } }
  /auth/devices:
    get:
      tags: [auth]
      operationId: listDevices
      summary: The account's passkeys. Requires step-up (403 step_up_required).
      x-min-tier: V0
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/devices/{id}:
    delete:
      tags: [auth]
      operationId: revokeDevice
      summary: Requires step-up. The only active passkey can't be removed (409 last_device).
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- assurance (02 §3, §5.1)
  /assurance/session:
    post:
      tags: [assurance]
      operationId: assuranceSession
      summary: Start a check at the identity provider. liveness raises V0 to V1; age (needs V1) plus the conduct declaration raises V1 to V2. Refused (503) while no provider holds a valid certificate for web capture (D-44, D-49, G-NG-4).
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [liveness, age] }
      responses:
        '201':
          description: Provider hand-off URL
          content: { application/json: { schema: { type: object, properties: { session_id: { type: string }, url: { type: string } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /assurance/callback:
    post:
      tags: [assurance]
      operationId: assuranceCallback
      summary: The provider's signed result (X-Provider-Timestamp, X-Provider-Signature). TRYST re-checks the age itself, keeps a one-way code of the document number and discards the number; applied once per session.
      security: []
      x-min-tier: sys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, result]
              properties:
                session_id: { type: string }
                result: { type: string, enum: [pass, fail] }
                is_adult: { type: boolean }
                birth_year_month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
                document_number: { type: string }
                method: { type: string }
      responses:
        '204': { description: Applied }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /assurance/status:
    get:
      tags: [assurance]
      operationId: assuranceStatus
      x-min-tier: V0
      responses:
        '200':
          description: Where the member is in verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  tier: { type: string }
                  liveness_done: { type: boolean }
                  conduct_accepted: { type: boolean }
                  conduct_version: { type: string }
                  id_checked: { type: boolean }
                  age_check: { type: string, enum: ['', pending, passed, failed, refused, duplicate, document_mismatch, not_eligible] }
                  refused: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
  /attestations/conduct:
    post:
      tags: [assurance]
      operationId: conductAttestation
      summary: Conduct declaration (ToS cl. 3.5); required to complete V2. Recorded with its version (and in the consent ledger).
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, accept]
              properties:
                version: { type: string }
                accept: { type: boolean, const: true }
      responses:
        '200': { description: Recorded; returns the verification status }
        '422': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- account (02 §5.2)
  /consents:
    get:
      tags: [account]
      operationId: listConsents
      summary: The member's consent ledger (append-only, hash-chained; FR-040, FR-126).
      x-min-tier: V0
      responses:
        '200':
          description: Ledger, current answers and chain verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/Consent' } }
                  current: { type: object, additionalProperties: { type: boolean } }
                  chain_ok: { type: boolean }
                  versions: { type: object, additionalProperties: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [account]
      operationId: appendConsent
      summary: Grant or withdraw art9_processing, biometric_login or safety_training_use. Other kinds are recorded where they are given (the conduct declaration, meets, couple links). Withdrawing art9_processing takes the member out of discovery at once.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, granted]
              properties:
                kind: { type: string, enum: [art9_processing, biometric_login, safety_training_use] }
                granted: { type: boolean }
      responses:
        '201':
          description: Appended (never mutated)
          content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /account/pause:
    post:
      tags: [account]
      operationId: pauseAccount
      summary: Out of discovery immediately; conversations carry on (FR-046, FR-127).
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Discretion state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscretionState' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /account/vanish:
    post:
      tags: [account]
      operationId: vanishAccount
      summary: Out of discovery and every conversation closed (the other member sees it closed, never why); account kept.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Discretion state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscretionState' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /account/resume:
    post:
      tags: [account]
      operationId: resumeAccount
      summary: Back into discovery after pause or vanish. Needs step-up (403 step_up_required).
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Discretion state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscretionState' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /account/export:
    post:
      tags: [account]
      operationId: exportAccount
      summary: Everything TRYST holds about the member, built on request and returned over the signed-in session (nothing is kept on the server). Messages are end-to-end encrypted, so only their metadata is included. Requires step-up (403 step_up_required, 02 §3.3).
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Export (download)
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="member-data.json"' }
          content: { application/json: { schema: { type: object, properties: { format: { const: tryst-member-export/v1 }, generated_at: { type: string, format: date-time } }, additionalProperties: true } } }
        '401': { $ref: '#/components/responses/Problem' }
  /account:
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: Cryptographic erasure < 60 s p99. Requires B1 only (never a full step-up) and the typed phrase "delete my account".
      description: The member's data key is destroyed first (sealed data in primaries and backups becomes unreadable), then they leave discovery, then records are purged service by service; identity goes last. Declared exceptions (ToS 15.3, 17.4) are named in the proof. An interrupted erasure is finished by a background sweep.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { const: delete my account } } } } }
      responses:
        '200':
          description: Erased
          content: { application/json: { schema: { type: object, properties: { deletion_job_id: { type: string }, status: { const: complete }, completion_proof: { $ref: '#/components/schemas/DeletionProof' } } } } }
        '202':
          description: Erasure in progress; the proof appears at /deletion-proofs/{id}
          content: { application/json: { schema: { type: object, properties: { deletion_job_id: { type: string }, status: { const: in_progress } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /deletion-proofs/key:
    get:
      tags: [account]
      operationId: deletionProofKey
      summary: Ed25519 public key that verifies completion proofs.
      security: []
      x-min-tier: none
      responses:
        '200': { description: Key, content: { application/json: { schema: { type: object, properties: { alg: { const: Ed25519 }, key_id: { type: string }, public_key: { type: string } } } } } }
  /deletion-proofs/{id}:
    get:
      tags: [account]
      operationId: deletionProof
      summary: A signed completion proof. It names the member only by a one-way code.
      security: []
      x-min-tier: none
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^del_[0-9a-f]{24}$' } }
      responses:
        '200': { description: Proof, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionProof' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /notices:
    get:
      tags: [account]
      operationId: listNotices
      summary: Masked in-app notices (what happened, never who), newest first.
      x-min-tier: V0
      responses:
        '200':
          description: Notices
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
                  notices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [match, message, meet_proposed, meet_update, safety, appeal, renewal, plan_ended, new_device, payment] }
                        text: { type: string }
                        link: { type: string }
                        at: { type: string, format: date-time }
                        read: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
  /notices/read:
    post:
      tags: [account]
      operationId: markNoticesRead
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: All read }
  /notifications/settings:
    get:
      tags: [account]
      operationId: getNotificationSettings
      x-min-tier: V0
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
    put:
      tags: [account]
      operationId: putNotificationSettings
      summary: Push is off by default. The wording is at most 40 characters, has no link and never names the app (FR-026).
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { push: { type: boolean }, text: { type: string, maxLength: 40 } } } } }
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /notifications/push:
    put:
      tags: [account]
      operationId: addPushEndpoint
      summary: Register this device's Web Push endpoint. Browser push services only; pushes carry no payload.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [endpoint], properties: { endpoint: { type: string, format: uri, maxLength: 1024 } } } } }
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [account]
      operationId: removePushEndpoint
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { endpoint: { type: string } } } } }
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
  /emergency-lock:
    post:
      tags: [account]
      operationId: emergencyLock
      summary: No session needed (FR-064). With the account's contact and its one-time emergency code (issued at sign-up, reissued by recovery or /auth/emergency-code), ends every session, refuses sign-in, hides the profile and stops its photos being served, until recovery. Same answer whatever was entered; 5 attempts a day per contact.
      security: []
      x-min-tier: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact, code]
              properties:
                contact: { type: string }
                code: { type: string, description: 'XXXX-XXXX-XXXX; case and spacing ignored' }
      responses:
        '202': { description: Uniform response }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/emergency-code:
    post:
      tags: [auth]
      operationId: newEmergencyCode
      summary: Replaces the emergency code. Needs step-up.
      x-min-tier: V0
      responses:
        '201':
          description: New code, shown once
          content: { application/json: { schema: { type: object, properties: { emergency_code: { type: string } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- intake / profile / discretion
  /intake/turn:
    post:
      tags: [intake]
      operationId: intakeTurn
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Cartographer reply and proposed structured fields (P2; not built in P1, D-65)
          content: { application/json: { schema: { $ref: '#/components/schemas/IntentVector' } } }
  /intake/vector:
    get:
      tags: [intake]
      operationId: getIntentVector
      x-min-tier: V0
      summary: The member's confirmed intake (P1 uses structured choices; the conversational Cartographer comes later, D-65) and the controlled vocabularies.
      responses:
        '200':
          description: Current vector, number of confirmed versions and the vocabularies
          content: { application/json: { schema: { type: object, properties: { vector: { $ref: '#/components/schemas/MatchVector' }, history: { type: integer }, vocab: { type: object } } } } }
  /intake/vector/confirm:
    post:
      tags: [intake]
      operationId: confirmIntentVector
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MatchVector' } } }
      responses:
        '200': { description: Confirmed; new history version (FR-079) }
        '422': { $ref: '#/components/responses/Problem' }
  /profile:
    get:
      tags: [intake]
      operationId: getProfile
      summary: The member's own profile (owner view) with what still blocks publication (FR-092).
      x-min-tier: V0
      responses:
        '200': { description: Owner view, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerProfile' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      tags: [intake]
      operationId: putProfile
      summary: Pseudonymous fields only. Display name screened (FR-098); area chosen from /profile/areas, never GPS.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfilePatch' } } }
      responses:
        '200': { description: Updated owner view, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerProfile' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /profile/areas:
    get:
      tags: [intake]
      operationId: listAreas
      summary: Selectable launch-city areas. The profile stores only the area's geohash-5 cell.
      x-min-tier: V0
      responses:
        '200':
          description: Areas
          content:
            application/json:
              schema:
                type: object
                properties:
                  areas:
                    type: array
                    items:
                      type: object
                      properties: { id: { type: string }, district: { type: string }, city: { type: string } }
  /profile/card:
    get:
      tags: [intake]
      operationId: getProfileCard
      summary: The member's card exactly as another verified member sees it (FR-092).
      x-min-tier: V0
      responses:
        '200':
          description: Card
          content:
            application/json:
              schema:
                type: object
                properties:
                  display_name: { type: string }
                  age: { type: [integer, 'null'], description: Whole years from the verified birth year-month (D-37) }
                  area: { type: string, example: 'Islington, London' }
                  distance: { type: string, example: 'About 10 km away' }
                  verified: { type: string, enum: [V0, V1, V2, V3] }
                  ready: { type: boolean }
                  photos:
                    type: [array, 'null']
                    items:
                      type: object
                      properties: { url: { type: string }, main: { type: boolean }, blurred: { type: boolean } }
  /profile/photos:
    post:
      tags: [intake]
      operationId: uploadProfilePhoto
      summary: >-
        Upload one public-tier profile photo (JPEG or PNG, at most 8 MB, at least 200 x 200).
        Location and device data are stripped on the device; the server reads provenance, runs
        the moderation vendors and the FR-093 rules, refuses (never stores) computer-generated,
        borrowed or third-party images, and re-encodes accepted photos to drop all metadata.
        At most 10 photos. The first photo that passes the main-photo rules becomes the main photo.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        '201':
          description: Accepted (live, or held for a person to check)
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo: { $ref: '#/components/schemas/ProfilePhoto' }
                  profile: { $ref: '#/components/schemas/OwnerProfile' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /profile/photos/order:
    put:
      tags: [intake]
      operationId: orderProfilePhotos
      summary: New gallery order (all photo ids). The main photo always stays first.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties: { ids: { type: array, maxItems: 10, items: { type: string } } }
      responses:
        '200': { description: Updated owner view, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerProfile' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /profile/photos/{photo_id}:
    parameters:
      - { name: photo_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [intake]
      operationId: getProfilePhoto
      summary: The stored (metadata-free) image; owner only in this API.
      x-min-tier: V0
      responses:
        '200': { description: Image, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [intake]
      operationId: revealProfilePhoto
      summary: Show or blur a photo behind the reveal ladder. The main photo cannot be blurred.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [revealed], properties: { revealed: { type: boolean } } }
      responses:
        '200': { description: Updated owner view, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerProfile' } } } }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [intake]
      operationId: deleteProfilePhoto
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Updated owner view, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerProfile' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /profile/photos/{photo_id}/main:
    parameters:
      - { name: photo_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [intake]
      operationId: setMainPhoto
      summary: Make this photo the main photo. Only photos that passed the main-photo rules (face clearly matched, not explicit).
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Updated owner view, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerProfile' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /profile/media:
    post:
      tags: [intake]
      operationId: uploadMedia
      x-min-tier: V1
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, ciphertext_upload]
              properties:
                tier: { type: string, enum: [profile_private, thread], description: 'Client-encrypted media. Public-tier profile photos use /profile/photos.' }
                ciphertext_upload: { type: boolean, const: true }
      responses:
        '201':
          description: Pre-signed upload target for client-encrypted ciphertext
          content: { application/json: { schema: { type: object } } }
  /profile/media/{id}:
    delete:
      tags: [intake]
      operationId: deleteMedia
      x-min-tier: V1
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '204': { description: Key destroyed } }
  /discretion:
    get:
      tags: [discretion]
      operationId: getDiscretion
      x-min-tier: V0
      responses:
        '200': { description: Discretion state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscretionState' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /discretion/policy:
    put:
      tags: [discretion]
      operationId: putDiscretionPolicy
      summary: New version. A change that shows the member to more people (visible instead of incognito, a longer distance, a lower counterpart tier) needs a fresh step-up (403 step_up_required); tightening never does.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility, max_distance_km, min_counterparty_tier]
              properties:
                visibility: { type: string, enum: [visible, incognito] }
                max_distance_km: { type: integer, enum: [5, 10, 25, 50] }
                min_counterparty_tier: { type: string, enum: [V2, V3] }
      responses:
        '200': { description: Discretion state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscretionState' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /discretion/zones:
    put:
      tags: [discretion]
      operationId: putZones
      summary: Up to 4 hidden areas (area IDs from /profile/areas). People in them and the member don't see each other, both ways (FR-011). Removing one needs step-up.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zones]
              properties:
                zones: { type: array, maxItems: 4, items: { type: string } }
      responses:
        '200': { description: Discretion state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscretionState' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /discretion/shield:
    post:
      tags: [discretion]
      operationId: addPartnerShield
      summary: Partner shield (FR-106). Each entry is the lowercase hex SHA-256 of a normalised contact, made on the device; the server keys it at once and keeps only that. If it matches a member, the two never see each other, silently. Up to 10.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [add]
              properties:
                add: { type: array, maxItems: 10, items: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '200': { description: Discretion state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscretionState' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [discretion]
      operationId: clearPartnerShield
      summary: Empties the shield. Needs step-up.
      x-min-tier: V0
      responses:
        '200': { description: Discretion state, content: { application/json: { schema: { $ref: '#/components/schemas/DiscretionState' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /exclusion/psi/blind:
    post:
      tags: [discretion]
      operationId: psiBlind
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blinded]
              properties:
                blinded: { type: array, maxItems: 5000, items: { type: string, contentEncoding: base64 } }
      responses:
        '200':
          description: Evaluated points
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluated: { type: array, items: { type: string, contentEncoding: base64 } }
  /exclusion/psi/commit:
    post:
      tags: [discretion]
      operationId: psiCommit
      summary: Nothing about the intersection is ever returned.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prf_outputs]
              properties:
                prf_outputs: { type: array, maxItems: 5000, items: { type: string, contentEncoding: base64 } }
      responses: { '204': { description: Accepted } }
  /burn:
    post:
      tags: [discretion]
      operationId: burn
      summary: Revoke device keys and sign out everywhere. Never gated by step-up.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '204': { description: Done } }

  # ---------------------------------------------------------------- couple (02 §5.4)
  /couple/invite:
    post:
      tags: [couple]
      operationId: coupleInvite
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [device_id], properties: { device_id: { type: string, minLength: 8 } } } } }
      responses:
        '409': { $ref: '#/components/responses/Problem' }
        '201':
          description: Co-sign token (24 h)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
  /couple/cosign:
    post:
      tags: [couple]
      operationId: coupleCosign
      summary: Must come from a device distinct from the inviter's (409 same_device_cosign) and approve the exact intake version shown (409 version_changed).
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, device_id, approved_version]
              properties:
                token: { type: string }
                device_id: { type: string, minLength: 8 }
                approved_version: { type: integer, minimum: 1 }
      responses:
        '201': { description: Couple link created }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /couple:
    get:
      tags: [couple]
      operationId: getCouple
      summary: The caller's couple link, veto mode, pending changes and reconfirmation (every 90 days; out of introductions 14 days after it is due).
      x-min-tier: V0
      responses: { '200': { description: '{couple} or {couple: null}' } }
  /couple/invite-preview:
    get:
      tags: [couple]
      operationId: previewCoupleInvite
      summary: What the invitee is approving (inviter's name and exact intake version).
      x-min-tier: V2
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: Preview }
        '404': { $ref: '#/components/responses/Problem' }
  /couple/{id}/reconfirm:
    post:
      tags: [couple]
      operationId: reconfirmCouple
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Reconfirmed } }
  /couple/{id}/veto-mode:
    put:
      tags: [couple]
      operationId: setVetoMode
      summary: Takes effect only when both partners have asked for the same mode.
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [veto_mode]
              properties:
                veto_mode: { type: string, enum: [either, both] }
      responses: { '200': { description: 'Current state: changed, or pending the other partner' } }
  /couple/{id}:
    delete:
      tags: [couple]
      operationId: dissolveCouple
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Dissolved immediately; the partner is told only that it ended } }

  # ---------------------------------------------------------------- discovery (02 §5.5)
  /slate:
    get:
      tags: [discovery]
      operationId: getSlate
      x-min-tier: V2
      responses:
        '200':
          description: Up to 18 cards including the 15% exploration floor
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    maxItems: 18
                    items: { $ref: '#/components/schemas/SlateCard' }
                  free_left: { type: integer }
                  unlimited: { type: boolean }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /slate/photos/{handle}/{n}:
    get:
      tags: [discovery]
      operationId: getSlatePhoto
      summary: The n-th photo the viewer may see of a member who still passes Stage 0 (blurred photos never served).
      x-min-tier: V2
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Image, content: { image/jpeg: {}, image/png: {} } }
        '404': { $ref: '#/components/responses/Problem' }
  /intent:
    post:
      tags: [discovery]
      operationId: sendIntent
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, description: The card's per-viewer handle }
      responses:
        '202':
          description: Accepted. 3 free a week; unlimited on TRYST+, DUO or ENVOY; otherwise Keys are held (5, or 15 from a couple to a single member) and refunded on reply. Inbound-cap overflow is queued and never revealed; a decline is never shown. mutual means the other side already wanted to meet and a handshake was opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  intent_id: { type: string }
                  state: { type: string, enum: [sent, mutual] }
                  handshake: { type: string }
                  free_left: { type: integer }
        '402': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /intents:
    get:
      tags: [discovery]
      operationId: listIntents
      summary: Intents received (delivered, still passing Stage 0), the caller's sent intents (as the sender sees them) and their handshakes. Releases queued intents as the inbound cap allows.
      x-min-tier: V2
      responses: { '200': { description: '{inbound, outbound, handshakes, free_left, unlimited}' } }
  /intents/{id}/reply:
    post:
      tags: [discovery]
      operationId: replyToIntent
      summary: accept opens a handshake; decline is never shown to the sender. Either reply refunds the sender's Keys.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [accept, decline] } } } } }
      responses:
        '200': { description: Handshake view }
        '204': { description: Declined }
        '404': { $ref: '#/components/responses/Problem' }
  /pass:
    post:
      tags: [discovery]
      operationId: pass
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Target' }
      responses: { '204': { description: Recorded privately } }
  /save:
    post:
      tags: [discovery]
      operationId: save
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Target' }
      responses: { '204': { description: Saved } }
  /tonight:
    get:
      tags: [discovery]
      operationId: getTonight
      summary: Tonight view (FR-109). Lists only members who are also free, within both radii, inside the Stage 0 gates.
      x-min-tier: V2
      responses:
        '200': { description: View, content: { application/json: { schema: { $ref: '#/components/schemas/TonightView' } } } }
    put:
      tags: [discovery]
      operationId: startTonight
      summary: Go free for 1-6 hours. Needs a complete profile.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours, radius_km]
              properties:
                hours: { type: integer, minimum: 1, maximum: 6 }
                radius_km: { type: integer, enum: [5, 10, 25, 50] }
      responses:
        '200': { description: View, content: { application/json: { schema: { $ref: '#/components/schemas/TonightView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [discovery]
      operationId: stopTonight
      summary: Stop now; hidden at once and tonight's interests are dropped.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: View, content: { application/json: { schema: { $ref: '#/components/schemas/TonightView' } } } }
  /tonight/interest/{handle}:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string }, description: Per-viewer handle }
    post:
      tags: [discovery]
      operationId: tonightInterest
      summary: Private interest, revealed to neither side until mutual. At most 10 per evening.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: View, content: { application/json: { schema: { $ref: '#/components/schemas/TonightView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /tonight/photos/{handle}/{n}:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
      - { name: n, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [discovery]
      operationId: tonightPhoto
      summary: The n-th photo the viewer may see (main and shown photos only; blurred photos are never served).
      x-min-tier: V2
      responses:
        '200': { description: Image, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /signals:batch:
    post:
      tags: [discovery]
      operationId: signalsBatch
      summary: Behaviour events, at most 50 per call. Never message content.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/BehaviourEvent' }
      responses: { '202': { description: Accepted } }
  /preferences/insights:
    get:
      tags: [discovery]
      operationId: preferenceInsights
      x-min-tier: V2
      responses:
        '200':
          description: Category-level view of learned preferences (never raw vectors)
          content: { application/json: { schema: { type: object } } }
  /preferences/correction:
    post:
      tags: [discovery]
      operationId: preferenceCorrection
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses: { '204': { description: Recorded } }
  /preferences/reset:
    post:
      tags: [discovery]
      operationId: preferenceReset
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '204': { description: Revealed vector neutralised; alpha = 0.15 } }
  /preferences/personalisation:
    put:
      tags: [discovery]
      operationId: setPersonalisation
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses: { '204': { description: Updated } }

  # ---------------------------------------------------------------- handshake / envoy / reveal
  /handshake/{id}/brief:
    get:
      tags: [handshake]
      operationId: getBrief
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The caller's own asymmetric Brief
          content: { application/json: { schema: { $ref: '#/components/schemas/Brief' } } }
  /handshake/{id}/decision:
    post:
      tags: [handshake]
      operationId: postHandshakeDecision
      summary: A thread opens only when both sides accept (couples per veto_mode).
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, decline] }
      responses:
        '200': { description: "The caller's view: state, and thread_id once both accepted" }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /envoy/proposals:
    get:
      tags: [handshake]
      operationId: listEnvoyProposals
      x-min-tier: V2
      x-entitlement: envoy
      responses:
        '200':
          description: Agent-proposed intents with rationale codes
          content: { application/json: { schema: { type: array, items: { type: object } } } }
  /envoy/proposals/{id}/approve:
    post:
      tags: [handshake]
      operationId: approveEnvoyProposal
      summary: One-tap human approval; no intent exists without it (D-04). id is the proposal card's handle.
      x-min-tier: V2
      x-entitlement: envoy
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '202': { description: Intent created } }
  /reveal-grants:
    post:
      tags: [reveal]
      operationId: createRevealGrant
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, scope, expires_at]
              properties:
                recipient: { type: string, format: uuid }
                scope: { $ref: '#/components/schemas/RevealScope' }
                media_id: { type: string, format: uuid }
                expires_at: { type: string, format: date-time }
      responses: { '201': { description: Grant created } }
  /reveal-grants/{id}:
    delete:
      tags: [reveal]
      operationId: revokeRevealGrant
      summary: Destroys the wrapped key; effective < 5 s p95 including CDN.
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '204': { description: Revoked } }

  # ---------------------------------------------------------------- threads (02 §5.7)
  /threads:
    get:
      tags: [threads]
      operationId: listThreads
      summary: The member's conversations, newest first. A thread exists only after mutual interest.
      x-min-tier: V2
      responses:
        '200': { description: Threads, content: { application/json: { schema: { type: object, properties: { threads: { type: array, items: { $ref: '#/components/schemas/ThreadView' } } } } } } }
  /threads/{id}:
    get:
      tags: [threads]
      operationId: getThread
      summary: Thread view plus both members' device public keys (for encrypting to every device).
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/ThreadId' }]
      responses:
        '200':
          description: Thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread: { $ref: '#/components/schemas/ThreadView' }
                  my_devices: { type: [array, 'null'], items: { $ref: '#/components/schemas/DeviceKey' } }
                  their_devices: { type: [array, 'null'], items: { $ref: '#/components/schemas/DeviceKey' } }
        '404': { $ref: '#/components/responses/Problem' }
  /threads/{id}/messages:
    get:
      tags: [threads]
      operationId: listMessages
      summary: Ciphertext only. Each message carries the envelope for the requesting device, if any. Expired messages are purged.
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/ThreadId' }
        - { name: device_id, in: query, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        client_id: { type: string }
                        mine: { type: boolean }
                        at: { type: string, format: date-time }
                        expires: { type: string, format: date-time }
                        envelope: { oneOf: [{ $ref: '#/components/schemas/DeviceEnvelope' }, { type: 'null' }] }
    post:
      tags: [threads]
      operationId: postMessage
      summary: One envelope per device of both members (ECDH P-256 + HKDF-SHA256 + AES-256-GCM, D-51). Idempotent on client_id.
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/ThreadId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, sender_device, envelopes]
              properties:
                client_id: { type: string }
                sender_device: { type: string }
                envelopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DeviceEnvelope' } }
      responses:
        '201': { description: Stored ciphertext, content: { application/json: { schema: { type: object, properties: { seq: { type: integer } } } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /threads/{id}/block:
    post:
      tags: [threads]
      operationId: blockThread
      summary: Close the thread for both and hide the pair from each other everywhere. The other member is not told why.
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/ThreadId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Closed } }
  /threads/{id}/signal:
    post:
      tags: [threads]
      operationId: threadGuardianSignal
      summary: On-device Guardian signal (kind and model only, never content). child_safety and extortion freeze the thread for review.
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/ThreadId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [fraud, child_safety, extortion] }
                model: { type: string }
                about: { type: string, enum: [received, blocked_send] }
      responses: { '200': { description: Recorded }, '422': { $ref: '#/components/responses/Problem' } }
  /threads/{id}/photo:
    get:
      tags: [threads]
      operationId: threadPhoto
      summary: The other member's main photo (not after a block).
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/ThreadId' }]
      responses: { '200': { description: Image, content: { image/jpeg: { schema: { type: string, format: binary } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /threads/{id}/retention:
    put:
      tags: [threads]
      operationId: setRetention
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/ThreadId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, enum: [7, 30, 90] }
      responses: { '204': { description: Shortest elected value applies } }
  /threads/{id}/meets:
    post:
      tags: [threads]
      operationId: proposeMeet
      summary: Propose a meet's time window. The place is never sent to the server; it travels in the encrypted thread with the door secret (FR-099, FR-115).
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/ThreadId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              additionalProperties: false
              properties:
                start: { type: string, format: date-time }
                end: { type: string, format: date-time, description: At most 12 hours after start; within the next month }
      responses:
        '201': { description: Proposed, content: { application/json: { schema: { $ref: '#/components/schemas/Meet' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /meets/{meet}:
    parameters: [{ name: meet, in: path, required: true, schema: { type: string } }]
    get:
      tags: [threads]
      operationId: getMeet
      x-min-tier: V2
      responses: { '200': { description: Meet, content: { application/json: { schema: { $ref: '#/components/schemas/Meet' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /meets/{meet}/confirm:
    parameters: [{ name: meet, in: path, required: true, schema: { type: string } }]
    post:
      tags: [threads]
      operationId: confirmMeet
      summary: Only the other member can confirm a proposed meet.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Confirmed }, '409': { $ref: '#/components/responses/Problem' } }
  /meets/{meet}/cancel:
    parameters: [{ name: meet, in: path, required: true, schema: { type: string } }]
    post:
      tags: [threads]
      operationId: cancelMeet
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Cancelled } }
  /meets/{meet}/safety:
    parameters: [{ name: meet, in: path, required: true, schema: { type: string } }]
    post:
      tags: [safety]
      operationId: startCheckIns
      summary: Start check-ins for a confirmed meet. Needs a trusted contact (kept for this meet only) or the safety line.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [every_minutes, pin, duress_pin]
              properties:
                every_minutes: { type: integer, minimum: 15, maximum: 180 }
                pin: { type: string, minLength: 4 }
                duress_pin: { type: string, minLength: 4, description: Must differ from pin }
                trusted_contact: { type: string, description: Phone (+…) or email; deleted when the meet ends }
                safety_line: { type: boolean }
      responses: { '200': { description: Running }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /meets/{meet}/checkin:
    parameters: [{ name: meet, in: path, required: true, schema: { type: string } }]
    post:
      tags: [safety]
      operationId: checkIn
      summary: Check in, or end with "home safe". The reply is identical for the check-in PIN and the duress PIN; the duress PIN never ends check-ins.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [pin], properties: { pin: { type: string }, end: { type: boolean } } } } }
      responses: { '200': { description: Checked in }, '422': { $ref: '#/components/responses/Problem' } }
  /threads/{id}/burn:
    post:
      tags: [threads]
      operationId: burnThread
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/ThreadId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '204': { description: Keys revoked on both sides } }
  /aftercare/{id}:
    post:
      tags: [threads]
      operationId: postAftercare
      x-min-tier: V2
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurred]
              properties:
                occurred: { type: boolean }
                as_represented: { type: integer, minimum: 1, maximum: 5 }
                would_repeat: { type: boolean }
                safety_flag: { type: boolean }
      responses: { '204': { description: Recorded privately; never shown to the counterparty } }

  # ---------------------------------------------------------------- safety (02 §5.8)
  /reports/categories:
    get:
      tags: [safety]
      operationId: reportCategories
      summary: Report categories with member-facing labels.
      x-min-tier: V0
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { type: object, properties: { key: { $ref: '#/components/schemas/ReportCategory' }, label: { type: string } } }
        '401': { $ref: '#/components/responses/Problem' }
  /reports:
    post:
      tags: [safety]
      operationId: report
      summary: Report the other member of a conversation. The reporter is never revealed and the other member is not told (FR-116).
      description: Opens a case with a deadline from the escalation matrix (03 §7.3). `disclosed` holds only messages the reporter chose to share; nothing else from an end-to-end encrypted thread reaches TRYST. Suspected minor, threats of violence and stalking freeze the subject until a moderator decides.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thread_id, category]
              properties:
                thread_id: { type: string, pattern: '^th_[0-9a-f]{24}$' }
                category: { $ref: '#/components/schemas/ReportCategory' }
                disclosed: { type: array, maxItems: 20, items: { type: string }, description: 'Reporter-decrypted messages, explicitly disclosed' }
                note: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Case opened
          content: { application/json: { schema: { type: object, properties: { reference: { type: string }, message: { type: string } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/standing:
    get:
      tags: [safety]
      operationId: myStanding
      summary: Enforcement decisions about the caller, with reasons and appeal state.
      x-min-tier: V0
      responses:
        '200':
          description: Standing
          content:
            application/json:
              schema:
                type: object
                properties:
                  standing: { type: string, enum: [good, warn, shadow_limit, suspend, permanent] }
                  under_review: { type: boolean, description: Paused until a moderator decides an open case }
                  decisions:
                    type: array
                    items:
                      type: object
                      properties:
                        decision_id: { type: string }
                        action: { type: string, enum: [warn, shadow_limit, suspend, permanent] }
                        reason: { type: string }
                        at: { type: string, format: date-time }
                        appeal: { type: object }
        '401': { $ref: '#/components/responses/Problem' }
  /block:
    post:
      tags: [safety]
      operationId: block
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Target' }
      responses: { '204': { description: Bidirectional and immediate } }
  /guardian/signals:
    post:
      tags: [safety]
      operationId: guardianSignal
      summary: On-device Guardian score and reason code. Never content.
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [thread_id, model_id, version, score, reason_code]
              properties:
                thread_id: { type: string, format: uuid }
                model_id: { type: string, pattern: '^M(6[a-e]|7b?)$' }
                version: { type: string }
                score: { type: number, minimum: 0, maximum: 1 }
                reason_code: { $ref: '#/components/schemas/GuardianReasonCode' }
      responses: { '202': { description: Accepted } }
  /safety/panic:
    post:
      tags: [safety]
      operationId: panic
      summary: Emergency escalation. Exact location is accepted here and only here (P7). Never gated; the reply always gives the 999 and Silent Solution guidance.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number }
                lon: { type: number }
                meet_id: { type: string }
      responses:
        '200':
          description: Escalated
          content: { application/json: { schema: { type: object, properties: { alert: { type: string }, call: { const: '999' }, silent_solution: { type: string } } } } }
  /safety/share-plan:
    post:
      tags: [safety]
      operationId: sharePlan
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: Encrypted, unbranded, auto-deleting share link
          content: { application/json: { schema: { type: object } } }
  /appeals:
    post:
      tags: [safety]
      operationId: appeal
      summary: Appeal an enforcement decision. Someone not involved in it decides within 10 working days; overturning restores standing.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision_id, text]
              properties:
                decision_id: { type: string }
                text: { type: string, minLength: 10, maxLength: 4000 }
      responses:
        '201':
          description: Appeal received
          content: { application/json: { schema: { type: object, properties: { due: { type: string, format: date-time }, message: { type: string } } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /attestations/dbs:
    post:
      tags: [safety]
      operationId: dbsAttestation
      x-min-tier: V2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { description: Verified through the issuing route; shown as a dated fact } }

  # ---------------------------------------------------------------- commerce (02 §5.9, D-22)
  /entitlements:
    get:
      tags: [commerce]
      operationId: getEntitlements
      x-min-tier: V0
      responses:
        '200':
          description: Entitlements
          content: { application/json: { schema: { $ref: '#/components/schemas/Entitlements' } } }
  /deposit:
    post:
      tags: [commerce]
      operationId: deposit
      summary: £9.99 refundable deposit, credited in full as 60 Keys.
      x-min-tier: V1
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { $ref: '#/components/responses/Checkout' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /keys/purchase:
    post:
      tags: [commerce]
      operationId: purchaseKeys
      x-min-tier: V1
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack]
              properties:
                pack: { type: string, enum: [keys_60] }
      responses:
        '201': { $ref: '#/components/responses/Checkout' }
        '422': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /vouchers/redeem:
    post:
      tags: [commerce]
      operationId: redeemVoucher
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Redeemed (single use; 5 failed attempts an hour per member)
          content: { application/json: { schema: { type: object, properties: { plan: { type: string }, keys: { type: integer }, message: { type: string } } } } }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /subscription:
    post:
      tags: [commerce]
      operationId: subscribe
      summary: Start a plan or the GHOST add-on. Requires the pre-contract information to have been shown and a separate request to start now (ToS 16.4); both are recorded.
      x-min-tier: V1
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, pre_contract_ack, start_now]
              properties:
                plan: { type: string, enum: [tryst_plus, tryst_plus_annual, envoy, duo, ghost] }
                pre_contract_ack: { type: boolean, const: true }
                start_now: { type: boolean, const: true, description: 'Express request to start within the cooling-off period' }
      responses:
        '201': { $ref: '#/components/responses/Checkout' }
        '422': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /subscription/cancel:
    post:
      tags: [commerce]
      operationId: cancelSubscription
      summary: One step; no retention flow; never gated by step-up. Within 14 days of starting, the plan ends now and the unused days are refunded; after that it runs to the end of the paid period.
      x-min-tier: V0
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { item: { type: string, description: 'Defaults to the current plan; "ghost" for the add-on' } } }
      responses:
        '200':
          description: Cancelled
          content: { application/json: { schema: { type: object, properties: { ends: { type: string, format: date-time }, ended: { type: string, format: date-time }, refund_minor: { type: integer }, message: { type: string } } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /billing/stripe/webhook:
    post:
      tags: [commerce]
      operationId: stripeWebhook
      summary: Server-to-server; Stripe-Signature verified; idempotent on event id.
      security: []
      x-min-tier: sys
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: Processed }
        '400': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    dpop:
      type: http
      scheme: DPoP
      description: OAuth2 access token bound to the device key with a DPoP proof (RFC 9449).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    ThreadId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^th_[0-9a-f]{24}$' }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    LoginRef:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [login_id]
            properties:
              login_id: { type: string }
    Target:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [target]
            properties:
              target: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Checkout:
      description: Hosted checkout (Stripe primary, D-22). Only the opaque billing reference and the product key are sent to the processor.
      content:
        application/json:
          schema:
            type: object
            properties:
              checkout_url: { type: string, format: uri }
  schemas:
    Meet:
      type: object
      properties:
        id: { type: string }
        thread: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        state: { type: string, enum: [proposed, confirmed, cancelled, done] }
        mine: { type: boolean }
        safety_active: { type: boolean }
        safety_line: { type: boolean }
    ThreadView:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        age: { type: [integer, 'null'] }
        state: { type: string, enum: [normal, frozen, closed] }
        retention_days: { type: integer, enum: [7, 30, 90] }
        last_seq: { type: integer }
        last_at: { type: string, format: date-time }
        created: { type: string, format: date-time }
    DeviceKey:
      type: object
      properties:
        id: { type: string }
        jwk: { type: object }
        added: { type: string, format: date-time }
    DeviceEnvelope:
      type: object
      required: [device_id, epk, iv, ct]
      properties:
        device_id: { type: string }
        epk: { type: string, description: "Sender's ephemeral P-256 public key (base64, raw)" }
        iv: { type: string }
        ct: { type: string, maxLength: 16384 }
    TonightPerson:
      type: object
      properties:
        handle: { type: string }
        display_name: { type: string }
        age: { type: [integer, 'null'] }
        area: { type: string }
        distance: { type: string, example: Nearby }
        photos: { type: integer }
        blurred: { type: integer }
        interested: { type: boolean }
        mutual: { type: boolean }
    TonightView:
      type: object
      properties:
        on: { type: boolean }
        ready: { type: boolean }
        tier_ok: { type: boolean }
        until: { type: string, format: date-time }
        radius_km: { type: integer }
        interests_left: { type: integer }
        max_hours: { type: integer }
        people: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/TonightPerson' } }
        mutual: { type: array, items: { $ref: '#/components/schemas/TonightPerson' } }
    ProfilePhoto:
      type: object
      properties:
        id: { type: string }
        main: { type: boolean }
        revealed: { type: boolean }
        status: { type: string, enum: [live, checking] }
        reason: { type: string }
        can_be_main: { type: boolean }
        main_problem: { type: string }
        url: { type: string }
    OwnerProfile:
      type: object
      properties:
        display_name: { type: string }
        age: { type: [integer, 'null'] }
        area: { type: object, properties: { id: { type: string }, label: { type: string } } }
        city_only: { type: boolean }
        photos: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ProfilePhoto' } }
        max_photos: { type: integer, const: 10 }
        ready: { type: boolean }
        problems: { type: [array, 'null'], items: { type: string } }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - auth_required
            - dpop_invalid
            - second_factor_required
            - step_up_required
            - authenticator_invalidated
            - tier_required
            - consent_required
            - jurisdiction_blocked
            - entitlement_required
            - not_found
            - idempotency_conflict
            - version_conflict
            - keys_insufficient
            - validation_failed
            - broadening_requires_confirmation
            - same_device_cosign
            - rate_limited
            - account_exists_sign_in
            - liveness_unavailable
        required_tier: { $ref: '#/components/schemas/Tier' }
        factor: { type: string, enum: [B1, B2, F1, F2] }
        consent_kind: { $ref: '#/components/schemas/ConsentKind' }
        retry_after: { type: integer }
    Tier: { type: string, enum: [V0, V1, V2, V3] }
    Surface: { type: string, enum: [mobile_app, mobile_pwa, desktop] }
    Session:
      type: object
      required: [access_token, expires_at, surface]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        surface: { $ref: '#/components/schemas/Surface' }
        tier: { $ref: '#/components/schemas/Tier' }
    LoginChallenge:
      type: object
      required: [challenge, required_factors]
      properties:
        challenge: { type: string }
        required_factors:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string, enum: [B1, B2, F1, F2] }
    LoginState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [factor1_ok, liveness_pending, approval_pending, denied] }
    Device:
      type: object
      properties:
        id: { type: string, description: 'First 8 bytes of the credential ID, in hex' }
        surface: { $ref: '#/components/schemas/Surface' }
        kind: { type: string, enum: [platform_biometric, platform_uv, roaming_key] }
        added: { type: string, format: date-time }
        revoked: { type: boolean }
    ConsentKind:
      type: string
      enum: [art9_processing, media_view, meet, couple_link, retention, conduct_attestation, safety_training_use, biometric_login]
    DiscretionState:
      type: object
      properties:
        status: { type: string, enum: [active, paused, vanished, locked] }
        policy:
          type: object
          properties:
            version: { type: integer }
            visibility: { type: string, enum: [visible, incognito] }
            max_distance_km: { type: integer }
            min_counterparty_tier: { type: string }
            zones: { type: array, items: { type: string } }
            at: { type: string, format: date-time }
        versions: { type: integer }
        shield: { type: integer, description: Number of shielded contacts }
    Consent:
      type: object
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ConsentKind' }
        granted: { type: boolean }
        scope: { type: string, description: Wording version the consent was given against }
        at: { type: string, format: date-time }
        prev_hash: { type: string }
        hash: { type: string, description: 'SHA-256(prev_hash, canonical record including the account)' }
    IntentShape: { type: string, enum: [one_off, recurring, ongoing, exploratory, third, couple] }
    IntentVector:
      type: object
      required: [intent_shape, hard_limits]
      properties:
        intent_shape: { type: array, items: { $ref: '#/components/schemas/IntentShape' } }
        structure:
          type: string
          enum: [attached_undisclosed, attached_disclosed, open_relationship, unattached, couple_seeking_third, couple_seeking_couple, prefer_not_to_say]
        desire_tags:
          type: object
          additionalProperties: { type: string, enum: ['yes', curious, 'no'] }
        hard_limits: { type: array, items: { type: string } }
        logistics: { type: object }
        min_counterparty_tier: { type: string, enum: [V2, V3], default: V2 }
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 2, maxLength: 24, description: 'Pseudonym; screened for contact details, prices and age references (FR-098)' }
        area_id: { type: string, description: 'From /profile/areas' }
        city_only: { type: boolean, description: 'Show only the city, not the district' }
        pronouns: { type: string, maxLength: 40 }
        gender_identity: { type: string, maxLength: 60 }
        seeking: { type: array, items: { type: string } }
        modes: { type: array, items: { $ref: '#/components/schemas/IntentShape' } }
        visibility: { type: string, enum: [public, matched, incognito] }
    RevealScope: { type: string, enum: [alias, blurred_gallery, photo_set, voice, video] }
    MatchVector:
      type: object
      required: [identity, seeking, intent_shape]
      properties:
        version: { type: integer, readOnly: true }
        identity: { type: string, enum: [woman, man, nonbinary] }
        seeking: { type: array, items: { type: string, enum: [women, men, nonbinary, couples] } }
        intent_shape: { type: array, items: { $ref: '#/components/schemas/IntentShape' } }
        hard_limits: { type: array, items: { $ref: '#/components/schemas/IntentShape' } }
        interests: { type: array, maxItems: 6, items: { type: string } }
        confirmed_at: { type: string, format: date-time, readOnly: true }
    SlateCard:
      type: object
      required: [handle, explanation_codes, paid_label, exploration]
      properties:
        handle: { type: string, description: Per-viewer handle; the account id never appears }
        display_name: { type: string }
        age: { type: [integer, 'null'] }
        area: { type: string }
        distance: { type: string, description: Approximate band only }
        couple: { type: boolean }
        shared_intent: { type: array, items: { $ref: '#/components/schemas/IntentShape' } }
        shared_interests: { type: array, items: { type: string } }
        photos: { type: integer }
        explanation_codes: { type: array, minItems: 2, maxItems: 4, items: { type: string, enum: [intent_match, shared_interests, nearby, same_city, both_verified] } }
        paid_label: { type: boolean }
        exploration: { type: boolean }
        saved: { type: boolean }
        intent_sent: { type: boolean }
    Brief:
      type: object
      required: [label, compatibility, aligned, friction, blocking, recommended_next]
      properties:
        label: { type: string, const: agent_generated }
        compatibility: { type: number, minimum: 0, maximum: 1 }
        aligned: { type: array, items: { type: string } }
        friction:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              detail_code: { type: string }
              suggested_resolution: { type: string }
        blocking: { type: array, items: { type: string } }
        recommended_next: { type: string, enum: [open_thread, amend, decline] }
        meet_probability_band: { type: string, enum: [low, medium, high] }
    BehaviourEvent:
      type: object
      additionalProperties: false
      required: [event_id, type, ts]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string }
        ts: { type: string, format: date-time }
        context:
          type: object
          properties:
            surface: { type: string }
            app_version: { type: string }
        value: { type: number }
    ReportCategory:
      type: string
      enum: [minor, ncii, sextortion, coercion, threat_violence, stalking, romance_fraud, commercial_sex, harassment, impersonation, protected_trait_harassment, exposure_threat, other]
    GuardianReasonCode:
      type: string
      enum: [m6a_coercive_control, m6b_boundary_violation, m6c_off_platform_pressure, m6d_identity_location_pressure, m6e_image_coercion, m7_authenticity, m7b_ban_evasion, payment_solicitation]
    Entitlements:
      type: object
      properties:
        plan: { type: string, enum: ['', tryst_plus, tryst_plus_annual, duo, envoy], description: 'Empty for Verified (free)' }
        ghost: { type: boolean }
        keys: { type: integer, minimum: 0 }
        deposit_paid: { type: boolean }
        payments_available: { type: boolean }
        subscriptions:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              name: { type: string }
              status: { type: string, enum: [active, past_due, trialing] }
              period_end: { type: string, format: date-time }
              cancel_at_period_end: { type: boolean }
              in_cooling_off: { type: boolean }
        voucher_plan: { type: object, properties: { plan: { type: string }, until: { type: string, format: date-time } } }
        catalogue: { type: array, items: { type: object } }
    DeletionProof:
      type: object
      required: [deletion_job_id, subject, completed_at, receipts, key_id, signature]
      properties:
        deletion_job_id: { type: string }
        subject: { type: string, description: 'SHA-256 of "tryst/erasure/v1\0" + account id' }
        started: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        receipts:
          type: array
          items:
            type: object
            properties:
              part: { type: string }
              erased: { type: integer }
              retained: { type: array, items: { type: string } }
        key_id: { type: string }
        signature: { type: string, description: Ed25519 over the canonical JSON of the other fields (base64) }
    NotificationSettings:
      type: object
      properties:
        push: { type: boolean }
        text: { type: string }
        devices: { type: integer }
        vapid_public_key: { type: string }
        push_available: { type: boolean }
