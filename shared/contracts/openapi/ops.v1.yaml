openapi: 3.1.0
info:
  title: TRYST Moderator Console API
  version: 1.0.0
  summary: Staff-only Trust & Safety console (FR-116, D-52).
  description: |
    Generated from docs/spec/02_Shared_Contracts.md §5.8 (moderator console). That section is
    the source of truth. Served by the standalone safety service (cmd/safety-svc, D-59) on a
    staff-only host behind the company sign-in proxy. In production the proxy's signed token
    (`Cf-Access-Jwt-Assertion`) is verified against its published keys, issuer and audience;
    roles come from the staff roster, never from the request. Every call is written to a
    hash-chained audit log. Reporters are never shown. `/vouchers` is served by the API.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://ops.tryst.example/ops/v1
    description: Placeholder staff-only host.
security:
  - staffAccess: []
tags:
  - name: cases
    description: Case queue, decisions and appeals
  - name: audit
    description: Audit log and transparency counts
paths:
  /cases:
    get:
      tags: [cases]
      operationId: listCases
      summary: Open cases and pending appeals, most urgent deadline first.
      responses:
        '200':
          description: Queue
          content: { application/json: { schema: { type: object, properties: { cases: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /cases/{id}:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [cases]
      operationId: getCase
      summary: Case detail. Reporter shown as "hidden".
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                type: object
                properties:
                  case: { $ref: '#/components/schemas/CaseSummary' }
                  subject: { type: object, properties: { name: { type: string }, area: { type: string } } }
                  disclosed: { type: [array, 'null'], items: { type: string } }
                  note: { type: string }
                  reporter: { const: hidden }
                  independent_reporters: { type: integer }
                  prior_strikes: { type: integer }
                  decision: { type: [object, 'null'] }
                  appeal: { type: [object, 'null'] }
                  external_required: { type: boolean }
                  external_due: { type: string, format: date-time }
                  external: { oneOf: [{ $ref: '#/components/schemas/ExternalReport' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /cases/{id}/photo:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [cases]
      operationId: revealCasePhoto
      summary: The subject's main photo, only with a recorded reason (audited).
      parameters:
        - { name: reason, in: query, required: true, schema: { type: string, minLength: 10 } }
      responses:
        '200': { description: Image, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /cases/{id}/decision:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    post:
      tags: [cases]
      operationId: decideCase
      summary: Dismiss or uphold. The action follows the enforcement ladder; permanent removal waits for a second moderator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, reason]
              properties:
                outcome: { type: string, enum: [dismiss, uphold] }
                ground: { type: string, enum: ['', g1, g2, g3, g4, g5, g6] }
                reason: { type: string, minLength: 10 }
      responses:
        '200': { description: Decision recorded, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /cases/{id}/confirm:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    post:
      tags: [cases]
      operationId: confirmRemoval
      summary: A different moderator confirms a permanent removal, or sends it back.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { agree: { type: boolean, default: true }, reason: { type: string } } }
      responses:
        '200': { description: Confirmed or sent back, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /cases/{id}/appeal:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    post:
      tags: [cases]
      operationId: decideAppeal
      summary: Decide an appeal. Anyone involved in the decision is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_wins, reason]
              properties:
                member_wins: { type: boolean }
                reason: { type: string, minLength: 10 }
      responses:
        '200': { description: Appeal decided, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /vouchers:
    post:
      tags: [audit]
      operationId: issueVouchers
      summary: Issue single-use gift codes (staff lead). Codes are returned once and stored only as hashes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, count]
              properties:
                grant: { type: string, pattern: '^(keys:[1-9][0-9]{0,3}|plan:(tryst_plus|tryst_plus_annual|duo|envoy):[1-9][0-9]{0,3})$' }
                count: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '201': { description: Codes, content: { application/json: { schema: { type: object, properties: { codes: { type: array, items: { type: string } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /cases/{id}/external-report:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    post:
      tags: [cases]
      operationId: recordExternalReport
      summary: Record a report made to an authority, with its reference. Required for upheld suspected-minor (CSEA) cases, which stay in the queue until recorded (due 24 h after the decision). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agency, reference]
              properties:
                agency: { type: string, enum: [NCA, police, IWF] }
                reference: { type: string, minLength: 3, maxLength: 100 }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { type: object, properties: { external: { $ref: '#/components/schemas/ExternalReport' } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /audit/verify:
    get:
      tags: [audit]
      operationId: verifyAudit
      summary: Verify the hash chain of console actions.
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, entries: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /stats:
    get:
      tags: [audit]
      operationId: stats
      summary: Transparency-report counts. No member data.
      responses:
        '200': { description: Counts, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /comms:
    get:
      tags: [comms]
      operationId: comms
      summary: "Staff: the communication catalogue (every message TRYST sends, its channels and exact wording), channel coverage, what is never sent and why, and the recent delivery log. The log holds no address, name or content."
      responses:
        '200': { description: Catalogue and log, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /comms/test:
    post:
      tags: [comms]
      operationId: commsTest
      summary: "Leads only: send one catalogue event to yourself. Email goes for real to the lead's staff address when a mailbox is set ('[Test]' subject); every other channel is recorded in sandbox. Never reaches a member, contact or the alarm centre."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: string, maxLength: 64 }
      responses:
        '200': { description: Result per channel, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /settings/vendor-keys:
    get:
      tags: [settings]
      operationId: vendorKeys
      summary: "Leads only: every vendor setting, grouped by vendor, with whether it is set and when it changed. Never a value."
      responses:
        '200':
          description: Groups and settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  launch_ready: { type: boolean, description: Every required group is complete }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        required: { type: boolean }
                        ready: { type: boolean }
                        missing: { type: integer }
                        settings:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              secret: { type: boolean }
                              required: { type: boolean }
                              help: { type: string }
                              set: { type: boolean }
                              updated: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /settings/vendor-keys/{name}:
    put:
      tags: [settings]
      operationId: setVendorKey
      summary: "Leads only: store a new value (write-only; checked first; audited by name, never by value)."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,40}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, maxLength: 8192 }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /settings/vendor-keys/apply:
    post:
      tags: [settings]
      operationId: applyVendorKeys
      summary: "Leads only: restart the services with the stored values (within about two minutes; about 30 seconds offline)."
      responses:
        '202': { description: Applying, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    staffAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: The sign-in proxy's signed JWT (RS256/ES256), verified against its JWKS, issuer, audience and expiry. Alternatively X-Staff-Identity from a configured header-asserting proxy address.
  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^cs_[0-9a-f]{18}$' }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, code]
            properties:
              title: { type: string }
              status: { type: integer }
              code: { type: string }
  schemas:
    CaseSummary:
      type: object
      properties:
        id: { type: string }
        category: { type: string }
        label: { type: string }
        source: { type: string, enum: [report, guardian] }
        opened: { type: string, format: date-time }
        due: { type: string, format: date-time }
        overdue: { type: boolean }
        state: { type: string, enum: [open, pending_second, closed] }
        appeal_pending: { type: boolean }
        external_report_pending: { type: boolean }
    ExternalReport:
      type: object
      properties:
        agency: { type: string, enum: [NCA, police, IWF] }
        reference: { type: string }
        by: { type: string }
        at: { type: string, format: date-time }
