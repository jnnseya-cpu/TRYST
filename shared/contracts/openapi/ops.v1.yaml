openapi: 3.1.0
info:
  title: TRYST Moderator Console API
  version: 1.0.0
  summary: Staff-only Trust & Safety console (FR-116, D-52).
  description: |
    Generated from docs/spec/02_Shared_Contracts.md §5.8 (moderator console). That section is
    the source of truth. Served by the standalone safety service (cmd/safety-svc, D-59) on a
    staff-only host behind the company sign-in proxy. In production the proxy's signed token
    (`Cf-Access-Jwt-Assertion`) is verified against its published keys, issuer and audience;
    roles come from the staff roster, never from the request. Every call is written to a
    hash-chained audit log. Reporters are never shown. `/vouchers` is served by the API.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://ops.tryst.example/ops/v1
    description: Placeholder staff-only host.
security:
  - staffAccess: []
tags:
  - name: cases
    description: Case queue, decisions and appeals
  - name: audit
    description: Audit log and transparency counts
  - name: growth
    description: "Growth intelligence (D-73), served by growth-svc: staff only, invisible to members"
paths:
  /cases:
    get:
      tags: [cases]
      operationId: listCases
      summary: Open cases and pending appeals, most urgent deadline first.
      responses:
        '200':
          description: Queue
          content: { application/json: { schema: { type: object, properties: { cases: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /cases/{id}:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [cases]
      operationId: getCase
      summary: Case detail. Reporter shown as "hidden".
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                type: object
                properties:
                  case: { $ref: '#/components/schemas/CaseSummary' }
                  subject: { type: object, properties: { name: { type: string }, area: { type: string } } }
                  disclosed: { type: [array, 'null'], items: { type: string } }
                  note: { type: string }
                  reporter: { const: hidden }
                  independent_reporters: { type: integer }
                  prior_strikes: { type: integer }
                  decision: { type: [object, 'null'] }
                  appeal: { type: [object, 'null'] }
                  external_required: { type: boolean }
                  external_due: { type: string, format: date-time }
                  external: { oneOf: [{ $ref: '#/components/schemas/ExternalReport' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /cases/{id}/photo:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [cases]
      operationId: revealCasePhoto
      summary: The subject's main photo, only with a recorded reason (audited).
      parameters:
        - { name: reason, in: query, required: true, schema: { type: string, minLength: 10 } }
      responses:
        '200': { description: Image, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /cases/{id}/decision:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    post:
      tags: [cases]
      operationId: decideCase
      summary: Dismiss or uphold. The action follows the enforcement ladder; permanent removal waits for a second moderator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, reason]
              properties:
                outcome: { type: string, enum: [dismiss, uphold] }
                ground: { type: string, enum: ['', g1, g2, g3, g4, g5, g6] }
                reason: { type: string, minLength: 10 }
      responses:
        '200': { description: Decision recorded, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /cases/{id}/confirm:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    post:
      tags: [cases]
      operationId: confirmRemoval
      summary: A different moderator confirms a permanent removal, or sends it back.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { agree: { type: boolean, default: true }, reason: { type: string } } }
      responses:
        '200': { description: Confirmed or sent back, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /cases/{id}/appeal:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    post:
      tags: [cases]
      operationId: decideAppeal
      summary: Decide an appeal. Anyone involved in the decision is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_wins, reason]
              properties:
                member_wins: { type: boolean }
                reason: { type: string, minLength: 10 }
      responses:
        '200': { description: Appeal decided, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /vouchers:
    post:
      tags: [audit]
      operationId: issueVouchers
      summary: Issue single-use gift codes (staff lead). Codes are returned once and stored only as hashes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, count]
              properties:
                grant: { type: string, pattern: '^(keys:[1-9][0-9]{0,3}|plan:(tryst_plus|tryst_plus_annual|duo|envoy):[1-9][0-9]{0,3})$' }
                count: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '201': { description: Codes, content: { application/json: { schema: { type: object, properties: { codes: { type: array, items: { type: string } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /cases/{id}/external-report:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    post:
      tags: [cases]
      operationId: recordExternalReport
      summary: Record a report made to an authority, with its reference. Required for upheld suspected-minor (CSEA) cases, which stay in the queue until recorded (due 24 h after the decision). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agency, reference]
              properties:
                agency: { type: string, enum: [NCA, police, IWF] }
                reference: { type: string, minLength: 3, maxLength: 100 }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { type: object, properties: { external: { $ref: '#/components/schemas/ExternalReport' } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /audit/verify:
    get:
      tags: [audit]
      operationId: verifyAudit
      summary: Verify the hash chain of console actions.
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, entries: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /stats:
    get:
      tags: [audit]
      operationId: stats
      summary: Transparency-report counts. No member data.
      responses:
        '200': { description: Counts, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /comms:
    get:
      tags: [comms]
      operationId: comms
      summary: "Staff: the communication catalogue (every message TRYST sends, its channels and exact wording), channel coverage, what is never sent and why, and the recent delivery log. The log holds no address, name or content."
      responses:
        '200': { description: Catalogue and log, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /comms/test:
    post:
      tags: [comms]
      operationId: commsTest
      summary: "Leads only: send one catalogue event to yourself. Email goes for real to the lead's staff address when a mailbox is set ('[Test]' subject); every other channel is recorded in sandbox. Never reaches a member, contact or the alarm centre."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: string, maxLength: 64 }
      responses:
        '200': { description: Result per channel, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /settings/vendor-keys:
    get:
      tags: [settings]
      operationId: vendorKeys
      summary: "Leads only: every vendor setting, grouped by vendor, with whether it is set and when it changed. Never a value."
      responses:
        '200':
          description: Groups and settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  launch_ready: { type: boolean, description: Every required group is complete }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        required: { type: boolean }
                        ready: { type: boolean }
                        missing: { type: integer }
                        settings:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              secret: { type: boolean }
                              required: { type: boolean }
                              help: { type: string }
                              set: { type: boolean }
                              updated: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /settings/vendor-keys/{name}:
    put:
      tags: [settings]
      operationId: setVendorKey
      summary: "Leads only: store a new value (write-only; checked first; audited by name, never by value)."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,40}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, maxLength: 8192 }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /settings/vendor-keys/apply:
    post:
      tags: [settings]
      operationId: applyVendorKeys
      summary: "Leads only: restart the services with the stored values (within about two minutes; about 30 seconds offline)."
      responses:
        '202': { description: Applying, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /growth/overview:
    get:
      tags: [growth]
      operationId: growthOverview
      summary: "Growth staff (growth, editor, lead): profile revision, freeze state, guide pages, source health, briefs, approved claims and prohibited wording. Invisible to members (D-73)."
      responses:
        '200': { description: Overview, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /growth/observations:
    post:
      tags: [growth]
      operationId: growthIngest
      summary: "growth role: import aggregate observations (Search Console export, trends index). Atomic; 1-500 items, 1 MiB; registered sources only; personal data refused; exact replay is a duplicate, same source version with different content is 409. Needs Idempotency-Key."
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/GrowthObservation' } } } } } }
      responses:
        '200': { description: Counts, content: { application/json: { schema: { type: object, properties: { accepted: { type: integer }, duplicate: { type: integer }, rejected: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /growth/refresh:
    post:
      tags: [growth]
      operationId: growthRefresh
      summary: "growth role: pull the member platform's weekly counts by city (k ≥ 50 only) and re-score every topic."
      responses:
        '202': { description: Scored, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /growth/opportunities:
    get:
      tags: [growth]
      operationId: growthOpportunities
      summary: "Latest frozen snapshot per topic with score, confidence, components, families, vetoes, reasons and evidence ids."
      parameters: [{ name: status, in: query, schema: { type: string, enum: [archived, watching, eligible] } }]
      responses:
        '200': { description: Opportunities, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /growth/briefs:
    post:
      tags: [growth]
      operationId: growthCreateBrief
      summary: "growth role: draft a Growth Brief v1 (shared/contracts/growth/growth-brief.v1.schema.yaml) from one eligible snapshot."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [snapshot_id], properties: { snapshot_id: { type: string } } } } }
      responses:
        '201': { description: Draft brief, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /growth/briefs/effective:
    get:
      tags: [growth]
      operationId: growthEffectiveBrief
      summary: "The one approved, fresh brief for a market, locale, topic and channel; 204 means use baseline behaviour."
      parameters:
        - { name: market, in: query, required: true, schema: { type: string } }
        - { name: locale, in: query, required: true, schema: { type: string } }
        - { name: topic, in: query, required: true, schema: { type: string } }
        - { name: channel, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Growth Brief v1, content: { application/json: { schema: { type: object } } } }
        '204': { description: "No approved, fresh brief" }
        '401': { $ref: '#/components/responses/Problem' }
  /growth/briefs/{id}:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    get:
      tags: [growth]
      operationId: growthBrief
      summary: "A brief with its changes, the current guide page, approved claim wording and the snapshot behind it."
      responses:
        '200': { description: Brief, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /growth/briefs/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    post:
      tags: [growth]
      operationId: growthApproveBrief
      summary: "editor role: approve an exact brief version (If-Match). The author can't approve. Freezes the experiment and replaces the active brief for the scope."
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: string } }]
      responses:
        '200': { description: Approved, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /growth/briefs/{id}/drafts:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    post:
      tags: [growth]
      operationId: growthDrafts
      summary: "growth role: the SEO and marketing workers draft changes for this approved brief (templates, or the deployment's own model). Drafts are proposals only."
      responses:
        '201': { description: Proposed changes, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /growth/actions:
    post:
      tags: [growth]
      operationId: growthPropose
      summary: "growth or editor role: propose a typed change (seo_metadata_patch, owned_content_patch, organic_social_draft) bound to the active brief and the page revision shown. Needs Idempotency-Key."
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GrowthProposal' } } }
      responses:
        '200': { description: Already proposed, content: { application/json: { schema: { type: object } } } }
        '201': { description: Proposed, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /growth/actions/{id}:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    get:
      tags: [growth]
      operationId: growthAction
      summary: "A change with its state, payload hash, approval, previous fields, receipt and inference notes."
      responses:
        '200': { description: Change, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /growth/actions/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    post:
      tags: [growth]
      operationId: growthApproveAction
      summary: "editor role: approve the exact payload hash and page revision from the preview. The author can't approve."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [payload_hash, target_revision], properties: { payload_hash: { type: string }, target_revision: { type: integer } } } } }
      responses:
        '200': { description: Approved, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /growth/actions/{id}/execute:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    post:
      tags: [growth]
      operationId: growthExecute
      summary: "editor role: queue an approved change. The worker re-checks every guard and writes compare-and-set with the action key."
      responses:
        '202': { description: Queued, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /growth/actions/{id}/rollback:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    post:
      tags: [growth]
      operationId: growthRollback
      summary: "editor role: queue a compensating change; it restores the page only if it is still at the revision this change produced, otherwise it stops for review. Allowed while frozen."
      responses:
        '202': { description: Queued, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /growth/actions/{id}/export:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    get:
      tags: [growth]
      operationId: growthExport
      summary: "Export a draft for a channel with no write path (organic social); recorded in the audit."
      responses:
        '200': { description: Draft copy, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /growth/pages:
    post:
      tags: [growth]
      operationId: growthCreatePage
      summary: "editor role: create a guide page from its reviewed starting wording. No guide page exists until an editor creates it."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [asset_id], properties: { asset_id: { type: string } } } } }
      responses:
        '201': { description: Page, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /growth/experiments/{id}:
    parameters: [{ $ref: '#/components/parameters/GrowthId' }]
    get:
      tags: [growth]
      operationId: growthExperiment
      summary: "Observational report: guide views and join clicks before and after the first applied change; counts under 10 withheld; a decision only above the frozen minimum sample."
      responses:
        '200': { description: Report, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /growth/freeze:
    post:
      tags: [growth]
      operationId: growthFreeze
      summary: "editor or lead: freeze or unfreeze. Frozen: no new change starts; rollback still works."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [frozen], properties: { frozen: { type: boolean } } } } }
      responses:
        '200': { description: Frozen state, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /growth/audit:
    get:
      tags: [growth]
      operationId: growthAudit
      summary: "The latest 500 growth audit entries (who, what, when)."
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    staffAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: The sign-in proxy's signed JWT (RS256/ES256), verified against its JWKS, issuer, audience and expiry. Alternatively X-Staff-Identity from a configured header-asserting proxy address.
  parameters:
    GrowthId: { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
    CaseId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^cs_[0-9a-f]{18}$' }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, code]
            properties:
              title: { type: string }
              status: { type: integer }
              code: { type: string }
  schemas:
    GrowthObservation:
      type: object
      description: One aggregate count or index value. Never a member identifier.
      required: [source_id, source_record_id, term, market, locale, metric, value, unit, coverage, window_start, window_end, observed_at]
      additionalProperties: false
      properties:
        source_id: { type: string }
        source_record_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$' }
        record_revision: { type: integer, minimum: 1 }
